  <!-- ⬇️ Incolla qui il blocco GA4 con consenso -->
<script>
(function(){
  // Il tuo Measurement ID
  const MEASUREMENT_ID = 'G-NGDS2Z0GFB';

  // Carica GA4 solo con consenso
  function injectGA(){
    if (window.gtagLoaded || !MEASUREMENT_ID) return; // evita doppi load
    window.gtagLoaded = true;

    // Carica gtag.js
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + MEASUREMENT_ID;
    document.head.appendChild(s);

    // Setup gtag
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    window.gtag = gtag;

    gtag('js', new Date());
    gtag('config', MEASUREMENT_ID, { anonymize_ip: true });
  }

  // 1) Se l'utente aveva già accettato
  if (localStorage.getItem('cookiesChoice') === 'accepted') {
    injectGA();
  }

  // 2) Quando clicca "Accetta"
  document.addEventListener('DOMContentLoaded', function(){
    var acceptBtn = document.getElementById('cookie-accept');
    if (acceptBtn) {
      acceptBtn.addEventListener('click', function(){
        // Se il tuo cookie.js NON lo fa già, puoi sbloccare la riga sotto:
        // localStorage.setItem('cookiesChoice','accepted');
        injectGA();
      });
    }
  });
})();
</script>
